[project]
name = "pixelproof-ml"
version = "0.1.0"
requires-python = ">=3.11,<3.14"
dependencies = [
  "fastapi>=0.139,<0.140",
  "huggingface-hub>=1.25,<1.26",
  "joblib>=1.5,<1.6",
  "numpy>=2.5,<2.6",
  "pillow>=12.3,<13",
  "python-multipart>=0.0.22,<0.1",
  "pyyaml>=6.0,<7",
  "safetensors>=0.8,<0.9",
  "scikit-learn>=1.9,<2",
  "scipy>=1.18,<2",
  "torch>=2.13,<2.14",
  "torchvision>=0.28,<0.29",
  "transformers>=5.15,<5.16",
  "uvicorn>=0.51,<0.52",
]

[project.optional-dependencies]
experiments = [
  "matplotlib>=3.11,<3.12",
  "pyarrow>=25,<26",
  "timm>=1.0,<1.1",
]
test = [
  "httpx>=0.28,<0.29",
  "pytest>=9.1,<10",
]

[project.scripts]
pixelproof-artifacts = "pixelproof.artifact_registry:main"
pixelproof-evaluate-project = "pixelproof.project_evaluate:main"
pixelproof-predict = "pixelproof.predict:main"

[build-system]
requires = ["setuptools>=83"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
