<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<!-- Local macOS rendering: use installed fonts, never a silent metric substitute.
     No font files are redistributed. PDF embedding is checked by audit_package.py. -->
<fontconfig>
  <dir>/System/Library/Fonts/Supplemental</dir>
  <dir>/Library/Fonts</dir>
  <cachedir prefix="xdg">fontconfig</cachedir>
</fontconfig>
