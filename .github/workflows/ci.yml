name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - name: Audit production/build dependencies (known high vinext debt is documented)
        run: |
          for attempt in 1 2 3; do
            if npm audit --audit-level=critical; then
              exit 0
            fi
            if [ "$attempt" -eq 3 ]; then
              echo "npm audit failed after three attempts"
              exit 1
            fi
            echo "npm audit attempt $attempt failed; retrying the registry endpoint"
            sleep $((attempt * 15))
          done

  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            ml/requirements-serving.lock
            ml/pyproject.toml
      - run: python -m pip install -r ml/requirements-serving.lock
      - run: python -m pip install -e "ml[experiments,test]" pip-audit==2.10.1
      - run: pytest -q ml/tests
      - run: python -m compileall -q ml/src ml/experiments ml/tools
      - run: python -m pip check
      - run: python -m pip_audit -r ml/requirements-serving.lock
